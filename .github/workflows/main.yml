name: blockchyp-csharp
on:
  push:
    branches:
      - "develop"
      - "master"
      - "preview"
    tags:
      - "*"
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/core/sdk:3.1
    steps:
      - uses: act10ns/slack@44541246747a30eb3102d87f7a4cc5471b0ffb7d # v2.1.0
        with:
          status: starting
          channel: '#gitactivity'
        if: always()
      - name: Check out repository code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: dotnet restore -v n
      - name: Run Build
        run: |
          dotnet build src/BlockChyp/BlockChyp.csproj -c Release -v n
          dotnet pack src/BlockChyp/BlockChyp.csproj -c Release -v n
      - name: Run Test
        run: >
          dotnet test tests/BlockChypTest/BlockChypTest.csproj
          --filter "Category!=Integration" -v n
      - uses: act10ns/slack@44541246747a30eb3102d87f7a4cc5471b0ffb7d # v2.1.0
        with:
          status: ${{ job.status }}
          channel: '#gitactivity'
        if: always()
  publish:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/core/sdk:3.1
    if: ${{ always() && contains(join(needs.*.result, ','), 'success') && startsWith(github.ref_name, 'v') }}
    needs: [ test ]
    steps:
      - uses: act10ns/slack@44541246747a30eb3102d87f7a4cc5471b0ffb7d # v2.1.0
        with:
          status: starting
          channel: '#gitactivity'
        if: always()
      - name: Check out repository code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: dotnet restore -v n
      - name: Run Build
        run: |
           dotnet build src/BlockChyp/BlockChyp.csproj -c Release -v n
           dotnet pack src/BlockChyp/BlockChyp.csproj -c Release -v n
      - name: Publish to Nuget
        run: >
          dotnet nuget push src/BlockChyp/bin/Release/BlockChyp.*.nupkg
          --api-key "${NUGET_API_KEY}"
          --source https://api.nuget.org/v3/index.json
      - uses: act10ns/slack@44541246747a30eb3102d87f7a4cc5471b0ffb7d # v2.1.0
        with:
          status: ${{ job.status }}
          channel: '#gitactivity'
        if: always()